[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading-system"
version = "1.0.0"
description = "주식 트레이딩 시스템 - 유명인 전략, AI 연동, 다중 증권사 및 실시간 대시보드"
readme = "README.md"
authors = [
    { name = "DeepMind Agentic Coding Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "websockets>=11.0.3,<13.0.0",
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0,<2.0.0",
    "pandas>=1.3.0,<3.0.0",
    "pyarrow>=10.0.0,<18.0.0",
    "aiosqlite>=0.17.0,<1.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "yfinance>=0.2.0,<1.0.0",
    "python-telegram-bot>=20.0,<22.0.0",
    "pyzmq>=25.0.0,<27.0.0",
    "openai>=1.0.0,<2.0.0",
    "google-generativeai>=0.3.0,<1.0.0",
    "finance-datareader>=0.9.200,<1.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "stable-baselines3>=2.0.0,<3.0.0",
    "gymnasium>=0.28.0,<1.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "transformers>=4.30.0,<5.0.0",
    "torch>=2.0.0,<4.0.0",
    "dash>=2.14.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "mypy>=1.0.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pip-audit>=2.0.0,<3.0.0",
    "coverage>=7.0.0,<8.0.0"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
