name: Python Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f trading_system/requirements.txt ]; then pip install -r trading_system/requirements.txt; fi
        pip install mypy ruff bandit pip-audit

    - name: Run type checking
      run: |
        python -m mypy trading_system/src --ignore-missing-imports --warn-unused-configs --warn-redundant-casts --warn-return-any

    - name: Lint (ruff)
      run: |
        ruff check trading_system/src

    - name: Security audit (bandit)
      run: |
        bandit -r trading_system/src -ll

    - name: Dependency vulnerability audit (pip-audit)
      run: |
        pip-audit -r trading_system/requirements.txt

    - name: Run unit tests
      run: |
        python -m unittest discover -s trading_system/tests -p "test_*.py"

    - name: Run system integration test
      run: |
        python trading_system/test_system.py
