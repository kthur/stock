name: Python Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: trading_system/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f trading_system/requirements.txt ]; then pip install -r trading_system/requirements.txt; fi
        pip install -e "trading_system[dev]"

    - name: Run type checking
      run: |
        python -m mypy trading_system/src --ignore-missing-imports --warn-unused-configs --warn-redundant-casts --warn-return-any

    - name: Lint (ruff)
      run: |
        ruff check trading_system/src

    - name: Security audit (bandit)
      run: |
        bandit -r trading_system/src -ll

    - name: Dependency vulnerability audit (pip-audit)
      run: |
        pip-audit -r trading_system/requirements.txt

    - name: Run unit tests
      run: |
        python -m unittest discover -s trading_system/tests -p "test_*.py"
        python -m coverage run --source=trading_system/src -m pytest trading_system/tests/ -v

    - name: Generate coverage report
      if: success()
      run: |
        python -m coverage report
        python -m coverage xml -o coverage.xml

    - name: Upload coverage to artifacts
      if: success() && matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
