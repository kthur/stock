name: Weekly Training Pipeline

on:
  schedule:
    - cron: '30 11 * * 6'
  workflow_dispatch:

concurrency:
  group: training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.txt') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install -r trading_system/requirements.txt

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-v1-

      - name: Cache market_indicators.db
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: indicators-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            indicators-v1-

      - name: Cache AI models
        uses: actions/cache@v4
        id: models-cache
        with:
          path: trading_system/models
          key: ai-models-v2-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            ai-models-v2-

      - name: Run prediction pipeline
        id: run
        env:
          DB_PATH: market_indicators.db
          STOCK_PRICE_DB_PATH: stock_prices.db
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          TRAIN_SAMPLE_SP500: all
          TRAIN_SAMPLE_KRX: all
          TRAIN_START_DATE: '2006-01-01'
          TRAIN_SEED: '42'
          UPDATE_INTERVAL: '0'
          INFERENCE_TARGET: SP500,KRX
          BROKER_TYPE: DUMMY
          MOCK_TRADING_ENABLED: 'True'
          DEBUG_MODE: 'False'
          LOG_LEVEL: INFO
          SKIP_TRAINING: 'False'
        run: |
          .venv/bin/python trading_system/run_pipeline.py 2>&1

      - name: Upload databases as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-databases
          path: |
            trading_system/stock_prices.db
            trading_system/market_indicators.db
          retention-days: 7

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f trading_system/result/*.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: weekly training and prediction results ($(date '+%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Create GitHub Release and Upload Assets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls trading_system/result/*.txt 1> /dev/null 2>&1; then
            TAG_NAME="v${{ steps.date.outputs.date }}"
            gh release create "$TAG_NAME" \
              --title "Daily Predictions $TAG_NAME" \
              --notes "Daily prediction results for $TAG_NAME.
              
              Includes:
              - **Regression**: pipeline_result.txt
              - **Surge**: surge_predictions.txt
              - **Lead-Lag**: lead_lag_predictions.txt
              - **VCP Rules**: vcp_patterns.txt
              - **VCP ML**: vcp_ml_predictions.txt
              - **Stat-Arb**: stat_arb_predictions.txt
              - **Ensemble**: ensemble_predictions.txt
              - **Allocation**: portfolio_allocation.txt" \
              || echo "Release $TAG_NAME already exists"
            gh release upload "$TAG_NAME" trading_system/result/*.txt --clobber
          else
            echo "No prediction output files found to upload."
          fi
