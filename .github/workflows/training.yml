name: Model Training Pipeline

on:
  schedule:
    - cron: '30 11 * * 6'
  workflow_dispatch:

concurrency:
  group: training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-training:
    runs-on: ubuntu-latest
    # Single job trains all 4 markets sequentially and saves ONE unified model cache.
    # Previously 4 matrix jobs each saved a partial cache (their own market only),
    # making it impossible for the daily pipeline to restore a complete model set.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.txt') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install -r trading_system/requirements.txt

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db (Restore and Save)
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-v1-

      - name: Cache market_indicators.db (Restore and Save)
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: indicators-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            indicators-v1-

      - name: Cache AI models (Save unified cache after full training)
        uses: actions/cache@v4
        id: models-cache
        with:
          path: trading_system/models
          # Key matches what pipeline.yml restores: ai-models-v2-<date>
          key: ai-models-v2-${{ steps.date.outputs.date }}

      - name: Run training pipeline (all markets)
        id: run
        env:
          DB_PATH: market_indicators.db
          STOCK_PRICE_DB_PATH: stock_prices.db
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          TRAIN_SAMPLE_SP500: all
          TRAIN_SAMPLE_KRX: all
          TRAIN_START_DATE: '2006-01-01'
          TRAIN_SEED: '42'
          UPDATE_INTERVAL: '0'
          BROKER_TYPE: DUMMY
          MOCK_TRADING_ENABLED: 'True'
          DEBUG_MODE: 'False'
          LOG_LEVEL: INFO
          SKIP_TRAINING: 'False'
          SKIP_INFERENCE: 'True'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python trading_system/run_pipeline.py 2>&1

      - name: Write Step Summary
        if: always()
        run: |
          STATUS="${{ steps.run.outcome }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          echo "## ${ICON} Model Training (All Markets)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ 실행 정보" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 학습 대상 | SP500 / KOSPI / KOSDAQ / KONEX (전체) |" >> $GITHUB_STEP_SUMMARY
          echo "| 상태 | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 일시 | $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST') |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 생성된 모델 현황" >> $GITHUB_STEP_SUMMARY
          if [ -d "trading_system/models" ]; then
            COUNT=$(ls -1 trading_system/models | wc -l)
            echo "학습 완료 후 총 **${COUNT}**개의 모델 파일이 통합 캐시로 저장되었습니다." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| 모델 종류 | 파일 수 |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| XGBoost 회귀 | $(ls trading_system/models/xgb_model_*.json 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
            echo "| XGBoost Surge | $(ls trading_system/models/xgb_surge_model_*.json 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
            echo "| LightGBM 회귀 | $(ls trading_system/models/lgb_model_*.txt 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
            echo "| LightGBM Surge | $(ls trading_system/models/lgb_surge_model_*.txt 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
            echo "| VCP ML | $(ls trading_system/models/*vcp_surge* 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 모델 폴더가 생성되지 않았습니다." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MSG="🚨 *[CRITICAL] GHA Training Pipeline Failed*%0A%0A"
            MSG+="*Market:* ALL (SP500 / KOSPI / KOSDAQ / KONEX)%0A"
            MSG+="*Status:* ${{ steps.run.outcome }}%0A"
            MSG+="*Time:* $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')%0A%0A"
            MSG+="*Run URL:* ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi
