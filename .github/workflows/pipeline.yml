name: Daily Pipeline

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.txt') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install -r trading_system/requirements.txt

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-v1-

      - name: Cache market_indicators.db
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: indicators-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            indicators-v1-

      - name: Run prediction pipeline
        id: run
        env:
          DB_PATH: market_indicators.db
          STOCK_PRICE_DB_PATH: stock_prices.db
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          TRAIN_SAMPLE_SP500: all
          TRAIN_SAMPLE_KRX: all
          TRAIN_START_DATE: '2006-01-01'
          TRAIN_SEED: '42'
          UPDATE_INTERVAL: '0'
          INFERENCE_TARGET: SP500,KRX
          BROKER_TYPE: DUMMY
          MOCK_TRADING_ENABLED: 'True'
          DEBUG_MODE: 'False'
          LOG_LEVEL: INFO
        run: |
          .venv/bin/python trading_system/run_pipeline.py 2>&1

      - name: Upload databases as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-databases
          path: |
            trading_system/stock_prices.db
            trading_system/market_indicators.db
          retention-days: 7

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            trading_system/pipeline_result.txt \
            trading_system/surge_predictions.txt \
            trading_system/lead_lag_predictions.txt \
            trading_system/vcp_patterns.txt \
            trading_system/vcp_ml_predictions.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: daily prediction results ($(date '+%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit"
          fi
