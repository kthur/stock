name: Daily Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [SP500, KOSPI, KOSDAQ, KONEX]
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.txt') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install -r trading_system/requirements.txt

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-v1-

      - name: Cache market_indicators.db
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: indicators-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            indicators-v1-

      - name: Cache AI models
        uses: actions/cache@v4
        id: models-cache
        with:
          path: trading_system/models
          key: ai-models-v2
          restore-keys: |
            ai-models-v2

      - name: Run prediction pipeline for ${{ matrix.target }}
        id: run
        env:
          DB_PATH: market_indicators.db
          STOCK_PRICE_DB_PATH: stock_prices.db
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          TRAIN_SAMPLE_SP500: all
          TRAIN_SAMPLE_KRX: all
          TRAIN_START_DATE: '2006-01-01'
          TRAIN_SEED: '42'
          UPDATE_INTERVAL: '0'
          INFERENCE_TARGET: ${{ matrix.target }}
          BROKER_TYPE: DUMMY
          MOCK_TRADING_ENABLED: 'True'
          DEBUG_MODE: 'False'
          LOG_LEVEL: INFO
          SKIP_TRAINING: ${{ steps.models-cache.outputs.cache-hit == 'true' && 'True' || 'False' }}
        run: |
          .venv/bin/python trading_system/run_pipeline.py 2>&1

      - name: Rename output files to avoid conflicts
        run: |
          mkdir -p trading_system/result_split
          for f in trading_system/result/*.txt; do
            if [ -f "$f" ]; then
              mv "$f" "trading_system/result_split/$(basename "$f" .txt)_${{ matrix.target }}.txt"
            fi
          done

      - name: Upload split results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.target }}
          path: trading_system/result_split/
          retention-days: 1

  merge-and-release:
    runs-on: ubuntu-latest
    needs: run-pipeline
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Download SP500 results
        uses: actions/download-artifact@v4
        with:
          name: result-SP500
          path: trading_system/result_SP500
        continue-on-error: true

      - name: Download KOSPI results
        uses: actions/download-artifact@v4
        with:
          name: result-KOSPI
          path: trading_system/result_KOSPI
        continue-on-error: true

      - name: Download KOSDAQ results
        uses: actions/download-artifact@v4
        with:
          name: result-KOSDAQ
          path: trading_system/result_KOSDAQ
        continue-on-error: true

      - name: Download KONEX results
        uses: actions/download-artifact@v4
        with:
          name: result-KONEX
          path: trading_system/result_KONEX
        continue-on-error: true

      - name: Merge and reconstruct outputs
        run: |
          mkdir -p trading_system/result
          
          # Merge pipeline_result.txt
          echo "=== Full Pipeline Inference Results (Merged) ===" > trading_system/result/pipeline_result.txt
          echo "Date: $(date '+%Y-%m-%d %H:%M')" >> trading_system/result/pipeline_result.txt
          echo "" >> trading_system/result/pipeline_result.txt
          
          for target in SP500 KOSPI KOSDAQ KONEX; do
            file_path="trading_system/result_${target}/pipeline_result_${target}.txt"
            if [ -f "$file_path" ]; then
              cat "$file_path" | grep -v -E '^(===|Date:|Total symbols:)' >> trading_system/result/pipeline_result.txt || true
            fi
          done
          
          # Combine other files directly or keep both versions
          cp trading_system/result_SP500/*_SP500.txt trading_system/result/ 2>/dev/null || true
          cp trading_system/result_KOSPI/*_KOSPI.txt trading_system/result/ 2>/dev/null || true
          cp trading_system/result_KOSDAQ/*_KOSDAQ.txt trading_system/result/ 2>/dev/null || true
          cp trading_system/result_KONEX/*_KONEX.txt trading_system/result/ 2>/dev/null || true

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f trading_system/result/*.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: daily prediction results ($(date '+%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Create GitHub Release and Upload Assets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for target files safely using find to avoid argument errors if directory has different files
          if ls trading_system/result/*.txt 1> /dev/null 2>&1 || ls trading_system/result/*/*.txt 1> /dev/null 2>&1; then
            TAG_NAME="v${{ steps.date.outputs.date }}"
            gh release create "$TAG_NAME" \
              --title "Daily Predictions $TAG_NAME" \
              --notes "Daily prediction results for $TAG_NAME (Merged SP500, KOSPI, KOSDAQ, KONEX)." \
              || echo "Release $TAG_NAME already exists"
            
            # Find and upload assets recursively to handle various subdirectory paths gracefully
            find trading_system/result -name "*.txt" -type f -exec gh release upload "$TAG_NAME" {} --clobber \;
          else
            echo "No prediction output files found to upload."
          fi
