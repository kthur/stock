name: Daily Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [SP500, KOSPI, KOSDAQ, KONEX]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.lock') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          # Use lockfile for deterministic, idempotent builds (P2: 3.3)
          uv pip sync trading_system/requirements.lock

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-v1-

      - name: Cache market_indicators.db
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: indicators-v1-${{ steps.date.outputs.date }}
          restore-keys: |
            indicators-v1-

      - name: Cache AI models (Restore only)
        uses: actions/cache/restore@v4
        id: models-cache
        with:
          path: trading_system/models
          key: ai-models-v2-${{ matrix.target }}-${{ steps.date.outputs.date }}
          restore-keys: |
            ai-models-v2-${{ matrix.target }}-

      - name: Run prediction pipeline for ${{ matrix.target }}
        id: run
        env:
          DB_PATH: market_indicators.db
          STOCK_PRICE_DB_PATH: stock_prices.db
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          TRAIN_SAMPLE_SP500: all
          TRAIN_SAMPLE_KRX: all
          TRAIN_START_DATE: '2006-01-01'
          TRAIN_SEED: '42'
          UPDATE_INTERVAL: '0'
          INFERENCE_TARGET: ${{ matrix.target }}
          BROKER_TYPE: DUMMY
          MOCK_TRADING_ENABLED: 'True'
          DEBUG_MODE: 'False'
          LOG_LEVEL: INFO
          SKIP_TRAINING: 'True'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          .venv/bin/python trading_system/run_pipeline.py 2>&1

      # P0/P2: GitHub Step Summary — visible in GHA Actions tab without opening logs
      - name: Write Step Summary
        if: always()
        run: |
          STATUS="${{ steps.run.outcome }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          echo "## ${ICON} Pipeline: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ 실행 정보" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 대상 | ${{ matrix.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 상태 | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 일시 | $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST') |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| SKIP_TRAINING | ${{ env.SKIP_TRAINING }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 출력 파일 현황" >> $GITHUB_STEP_SUMMARY
          echo "| 파일 | 크기 | 줄 수 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-------|" >> $GITHUB_STEP_SUMMARY
          for f in pipeline_result.txt surge_predictions.txt lead_lag_predictions.txt vcp_patterns.txt vcp_ml_predictions.txt pipeline_result.csv; do
            FPATH="trading_system/result/$f"
            if [ -f "$FPATH" ]; then
              SIZE=$(du -sh "$FPATH" 2>/dev/null | cut -f1)
              LINES=$(wc -l < "$FPATH" 2>/dev/null || echo "?")
              echo "| $f | $SIZE | $LINES |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $f | ⚠️ 없음 | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      # P0: Telegram failure notification — send CRITICAL alert when pipeline fails
      - name: Notify Telegram on Failure
        if: failure()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MSG="🚨 *[CRITICAL] GHA Pipeline Failed*%0A%0A"
            MSG+="*Market:* ${{ matrix.target }}%0A"
            MSG+="*Status:* ${{ steps.run.outcome }}%0A"
            MSG+="*Time:* $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')%0A%0A"
            MSG+="*Run URL:* ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi

      - name: Rename output files to avoid conflicts
        if: always()
        run: |
          mkdir -p trading_system/result_split
          for f in pipeline_result surge_predictions lead_lag_predictions vcp_patterns vcp_ml_predictions ensemble_predictions; do
            src="trading_system/result/${f}.txt"
            if [ -f "$src" ]; then
              cp "$src" "trading_system/result_split/${f}_${{ matrix.target }}.txt"
            fi
          done

      - name: Upload split results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.target }}
          path: trading_system/result_split/
          retention-days: 1

  merge-and-release:
    runs-on: ubuntu-latest
    needs: run-pipeline
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Download SP500 results
        uses: actions/download-artifact@v4
        with:
          name: result-SP500
          path: trading_system/result_SP500
        continue-on-error: true

      - name: Download KOSPI results
        uses: actions/download-artifact@v4
        with:
          name: result-KOSPI
          path: trading_system/result_KOSPI
        continue-on-error: true

      - name: Download KOSDAQ results
        uses: actions/download-artifact@v4
        with:
          name: result-KOSDAQ
          path: trading_system/result_KOSDAQ
        continue-on-error: true

      - name: Download KONEX results
        uses: actions/download-artifact@v4
        with:
          name: result-KONEX
          path: trading_system/result_KONEX
        continue-on-error: true

      - name: Merge and reconstruct outputs
        run: |
          mkdir -p trading_system/result
          
          # Merge pipeline_result.txt
          echo "=== Full Pipeline Inference Results (Merged) ===" > trading_system/result/pipeline_result.txt
          echo "Date: $(date '+%Y-%m-%d %H:%M')" >> trading_system/result/pipeline_result.txt
          echo "" >> trading_system/result/pipeline_result.txt
          
          for target in SP500 KOSPI KOSDAQ KONEX; do
            file_path="trading_system/result_${target}/pipeline_result_${target}.txt"
            if [ -f "$file_path" ]; then
              cat "$file_path" | grep -v -E '^(===|Date:|Total symbols:)' >> trading_system/result/pipeline_result.txt || true
            fi
          done
          
          # Combine other files directly or keep both versions
          cp trading_system/result_SP500/*_SP500.txt trading_system/result/ 2>/dev/null || true
          cp trading_system/result_KOSPI/*_KOSPI.txt trading_system/result/ 2>/dev/null || true
          cp trading_system/result_KOSDAQ/*_KOSDAQ.txt trading_system/result/ 2>/dev/null || true
          cp trading_system/result_KONEX/*_KONEX.txt trading_system/result/ 2>/dev/null || true

      - name: Upload merged results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-results
          path: trading_system/result/
          retention-days: 7

      - name: Create GitHub Release and Upload Assets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for target files safely using find to avoid argument errors if directory has different files
          if ls trading_system/result/*.txt 1> /dev/null 2>&1 || ls trading_system/result/*/*.txt 1> /dev/null 2>&1; then
            TAG_NAME="v${{ steps.date.outputs.date }}"
            gh release create "$TAG_NAME" \
              --title "Daily Predictions $TAG_NAME" \
              --notes "Daily prediction results for $TAG_NAME (Merged SP500, KOSPI, KOSDAQ, KONEX)." \
              || echo "Release $TAG_NAME already exists"
            
            # Upload only core 6 files
            for f in pipeline_result.txt surge_predictions.txt lead_lag_predictions.txt \
                      vcp_patterns.txt vcp_ml_predictions.txt ensemble_predictions.txt; do
              fpath="trading_system/result/$f"
              [ -f "$fpath" ] && gh release upload "$TAG_NAME" "$fpath" --clobber || true
            done
          else
            echo "No prediction output files found to upload."
          fi

  deploy-pages:
    runs-on: ubuntu-latest
    needs: merge-and-release
    if: always()
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download merged results artifact
        uses: actions/download-artifact@v4
        with:
          name: merged-results
          path: trading_system/result
        continue-on-error: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Generate HTML dashboard
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          .venv/bin/python trading_system/generate_report.py \
            --result-dir trading_system/result \
            --out gh-pages/index.html
          # Copy any extra static assets if they exist
          cp trading_system/result/pipeline_result.txt gh-pages/ 2>/dev/null || true

      - name: Write build info
        run: |
          echo "Built: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')" > gh-pages/build.txt
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> gh-pages/build.txt
          ls -lh gh-pages/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
