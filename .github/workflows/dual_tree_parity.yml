name: Dual-Tree Parity Guard

permissions:
  contents: read

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-parity:
    name: Dual-Tree Cryptographic Parity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Dual-Tree SHA-256 Cryptographic Parity
        id: verify_parity
        continue-on-error: false
        run: |
          python scripts/verify_dual_tree_parity.py \
            --check \
            --strict \
            --diff \
            --gh-annotations \
            --step-summary \
            --json-output parity_report.json

      - name: Upload Parity Mismatch Forensic Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-mismatch-report
          path: parity_report.json
          if-no-files-found: warn
          retention-days: 30
