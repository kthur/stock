name: Weekly Optuna HPO

permissions:
  contents: read

on:
  schedule:
    - cron: '0 18 * * 0' # Every Sunday 18:00 UTC (Monday 03:00 KST)
  workflow_dispatch:
    inputs:
      target_market:
        description: 'HPO 최적화 대상 시장 / 국가 선택 (Select Target Market / Country for HPO)'
        required: true
        default: 'CORE_5'
        type: choice
        options:
          - 'CORE_5'
          - 'ALL'
          - 'KOSPI'
          - 'KOSDAQ'
          - 'SP500'
          - 'NASDAQ'
          - 'RUSSELL2000'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGET="${{ inputs.target_market || 'CORE_5' }}"
          echo "Selected target market input: $TARGET"
          if [ "$TARGET" = "CORE_5" ] || [ "$TARGET" = "ALL" ]; then
            echo 'matrix=["SP500", "NASDAQ", "RUSSELL2000", "KOSPI", "KOSDAQ"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$TARGET\"]" >> $GITHUB_OUTPUT
          fi

  optuna-hpo:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.lock') }}

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore SQLite Database Cache
        uses: actions/cache@v4
        with:
          path: |
            trading_system/market_indicators.db
            trading_system/stock_prices.db
          key: stock-prices-db-${{ matrix.target }}-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-db-${{ matrix.target }}-
            stock-prices-db-

      - name: Restore and Save AI Models Cache (for tuned_params.json handoff)
        uses: actions/cache@v4
        with:
          path: trading_system/models
          key: ai-models-${{ matrix.target }}-${{ steps.date.outputs.date }}
          restore-keys: |
            ai-models-${{ matrix.target }}-
            ai-models-

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip sync trading_system/requirements.lock

      - name: Run Optuna Hyperparameter Optimization
        id: run
        env:
          INFERENCE_TARGET: ${{ matrix.target }}
          N_TRIALS: '30'
          LOG_LEVEL: INFO
          FORCE_CPU: '1'
        run: |
          mkdir -p trading_system/logs
          set -o pipefail
          .venv/bin/python trading_system/scripts/tune_models.py 2>&1 | tee trading_system/logs/hpo_${{ matrix.target }}.log

      - name: Write HPO Step Summary
        if: always()
        run: |
          STATUS="${{ steps.run.outcome }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          echo "## ${ICON} 주간 HPO 튜닝 요약: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 내용 |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 대상 마켓 | ${{ matrix.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 최적화 상태 | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 일시 | $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST') |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY

          PARAM_FILE=$(ls -t trading_system/models/*${{ matrix.target }}*.json 2>/dev/null | head -1)
          if [ -z "$PARAM_FILE" ]; then
            PARAM_FILE=$(ls -t trading_system/models/*.json 2>/dev/null | head -1)
          fi
          if [ -n "$PARAM_FILE" ] && [ -f "$PARAM_FILE" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><b>🎯 최적 하이퍼파라미터 및 지표 (펼치기)</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$PARAM_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$STATUS" != "success" ]; then
            LOG_FILE="trading_system/logs/hpo_${{ matrix.target }}.log"
            if [ -f "$LOG_FILE" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
              echo "> **HPO 튜닝 오류 로그 (최근 25줄)**:" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 25 "$LOG_FILE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            ERR_SNIPPET=""
            LOG_FILE="trading_system/logs/hpo_${{ matrix.target }}.log"
            if [ -f "$LOG_FILE" ]; then
              ERR_SNIPPET=$(tail -n 5 "$LOG_FILE" | tr '\n' ' ' | cut -c1-200)
            fi
            MSG="🚨 *[Weekly HPO] Hyperparameter Tuning Failed*%0A%0A"
            MSG+="*Market:* ${{ matrix.target }}%0A"
            MSG+="*Status:* ${{ steps.run.outcome }}%0A"
            MSG+="*Time:* $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')%0A"
            if [ -n "$ERR_SNIPPET" ]; then
              MSG+="*Error:* \`${ERR_SNIPPET}\`%0A"
            fi
            MSG+="*Run URL:* ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi

      - name: Upload Tuned Parameters Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuned-params-${{ matrix.target }}
          path: trading_system/models/*.json
          retention-days: 7
