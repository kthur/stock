name: Python Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: trading_system/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f trading_system/requirements.txt ]; then pip install -r trading_system/requirements.txt; fi
        pip install pytest ruff mypy coverage bandit pip-audit pytest-github-actions-annotate-failures

    - name: Run type checking
      working-directory: trading_system
      run: |
        python -m mypy src --ignore-missing-imports --warn-unused-configs --warn-redundant-casts --warn-return-any

    - name: Lint (ruff)
      run: |
        ruff check trading_system/src

    - name: Security audit (bandit)
      run: |
        bandit -r trading_system/src -ll

    - name: Dependency vulnerability audit (pip-audit)
      continue-on-error: true
      run: |
        pip-audit -r trading_system/requirements.txt

    - name: Run unit tests
      working-directory: trading_system
      env:
        STOCK_PRICE_FRESHNESS_DAYS: none
        PYTHONPATH: .
      run: |
        python -m coverage run --source=src -m pytest tests/ -v

    - name: Generate coverage report
      if: success()
      working-directory: trading_system
      run: |
        python -m coverage report
        python -m coverage xml -o coverage.xml

    - name: Upload coverage to artifacts
      if: success() && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: trading_system/coverage.xml
