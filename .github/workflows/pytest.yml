name: CI / Testing & Security Audit

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv pip install --system --upgrade pip
        if [ -f trading_system/requirements.lock ]; then uv pip install --system -r trading_system/requirements.lock; fi
        uv pip install --system pytest ruff mypy coverage bandit pip-audit pytest-github-actions-annotate-failures

    - name: Run type checking
      working-directory: trading_system
      run: |
        python -m mypy src --explicit-package-bases --ignore-missing-imports --warn-unused-configs --warn-redundant-casts --warn-return-any

    - name: Lint (ruff)
      run: |
        ruff check trading_system/src

    - name: Security audit (bandit)
      run: |
        bandit -r trading_system/src -ll

    - name: Dependency vulnerability audit (pip-audit)
      continue-on-error: true
      run: |
        pip-audit -r trading_system/requirements.lock

    - name: Run unit tests
      working-directory: trading_system
      env:
        STOCK_PRICE_FRESHNESS_DAYS: none
        PYTHONPATH: .
      run: |
        python -m coverage run --source=src -m pytest tests/ -v

    - name: Generate coverage report
      if: always()
      working-directory: trading_system
      run: |
        python -m coverage report
        python -m coverage xml -o coverage.xml

    - name: Upload coverage to artifacts
      if: always() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: trading_system/coverage.xml
