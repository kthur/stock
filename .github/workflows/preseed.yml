name: Preseed Database Cache

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: preseed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preseed:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.txt') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install -r trading_system/requirements.txt

      - name: Cache stock_prices.db
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-v1-${{ github.run_id }}
          restore-keys: |
            stock-prices-v1-

      - name: Cache market_indicators.db
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: indicators-v1-${{ github.run_id }}
          restore-keys: |
            indicators-v1-

      - name: Run pipeline (slow preseed, UPDATE_INTERVAL=15)
        continue-on-error: true
        env:
          DB_PATH: market_indicators.db
          STOCK_PRICE_DB_PATH: stock_prices.db
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          TRAIN_SAMPLE_SP500: all
          TRAIN_SAMPLE_KRX: all
          TRAIN_START_DATE: '2006-01-01'
          TRAIN_SEED: '42'
          UPDATE_INTERVAL: '15'
          INFERENCE_TARGET: SP500,KRX
          BROKER_TYPE: DUMMY
          MOCK_TRADING_ENABLED: 'True'
          DEBUG_MODE: 'False'
          LOG_LEVEL: INFO
        run: |
          .venv/bin/python trading_system/run_pipeline.py 2>&1
