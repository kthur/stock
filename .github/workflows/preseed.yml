name: Preseed Database Cache

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: preseed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preseed:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.lock') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip sync trading_system/requirements.lock

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-db-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-db-

      - name: Cache market_indicators.db
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: market-indicators-db-${{ steps.date.outputs.date }}
          restore-keys: |
            market-indicators-db-

      - name: Cache AI models
        uses: actions/cache@v4
        id: models-cache
        with:
          path: trading_system/models
          key: ai-models-preseed-${{ steps.date.outputs.date }}
          restore-keys: |
            ai-models-KOSPI-
            ai-models-KOSDAQ-
            ai-models-SP500-
            ai-models-NASDAQ-
            ai-models-RUSSELL2000-
            ai-models-

      - name: Run preseed to update caches (cache-only)
        env:
          TRAIN_START_DATE: '2006-01-01'
          PRESEED_MODE: 'True'
        run: |
          source .venv/bin/activate
          python trading_system/run_pipeline.py --skip-training --skip-inference

      - name: Upload databases as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-databases
          path: |
            trading_system/stock_prices.db
            trading_system/market_indicators.db
          retention-days: 7

