name: Preseed Database Cache

permissions:
  contents: read

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      target_market:
        description: 'DB 프리시딩 대상 시장 / 국가 선택 (Select Target Market / Country for Preseed)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - 'ALL'
          - 'CORE_5'
          - 'KOSPI'
          - 'KOSDAQ'
          - 'SP500'
          - 'NASDAQ'
          - 'RUSSELL2000'
          - 'CHINA'
          - 'JAPAN'
          - 'INDIA'
          - 'EUROPE'
          - 'VIETNAM'
          - 'TAIWAN'
          - 'AUSTRALIA'
          - 'BRAZIL'
          - 'HKEX'
          - 'SINGAPORE'
          - 'CANADA'
          - 'ASIA_DEV'
          - 'ASIA_EMG'
          - 'COMMODITY'

concurrency:
  group: preseed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGET="${{ inputs.target_market || 'ALL' }}"
          echo "Selected preseed target market input: $TARGET"
          if [ "$TARGET" = "CORE_5" ]; then
            echo 'matrix=["SP500", "NASDAQ", "RUSSELL2000", "KOSPI", "KOSDAQ"]' >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "ALL" ]; then
            echo 'matrix=["SP500", "NASDAQ", "RUSSELL2000", "KOSPI", "KOSDAQ", "CHINA", "JAPAN", "INDIA", "EUROPE", "VIETNAM", "TAIWAN", "AUSTRALIA", "BRAZIL", "HKEX", "SINGAPORE", "CANADA"]' >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "ASIA_DEV" ]; then
            echo 'matrix=["JAPAN", "TAIWAN", "HKEX", "SINGAPORE"]' >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "ASIA_EMG" ]; then
            echo 'matrix=["CHINA", "INDIA", "VIETNAM"]' >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "COMMODITY" ]; then
            echo 'matrix=["AUSTRALIA", "BRAZIL", "CANADA"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$TARGET\"]" >> $GITHUB_OUTPUT
          fi

  run-preseed:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          if [ -f trading_system/requirements.lock ]; then
            uv pip sync trading_system/requirements.lock
          else
            uv pip install -r trading_system/requirements.txt
          fi

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache stock_prices.db (Restore and Save per Market)
        uses: actions/cache@v4
        id: db-cache
        with:
          path: trading_system/stock_prices.db
          key: stock-prices-db-${{ matrix.target }}-${{ steps.date.outputs.date }}
          restore-keys: |
            stock-prices-db-${{ matrix.target }}-
            stock-prices-db-

      - name: Cache market_indicators.db (Restore and Save per Market)
        uses: actions/cache@v4
        id: indicators-cache
        with:
          path: trading_system/market_indicators.db
          key: market-indicators-db-${{ matrix.target }}-${{ steps.date.outputs.date }}
          restore-keys: |
            market-indicators-db-${{ matrix.target }}-
            market-indicators-db-

      - name: Cache AI models (Restore and Save per Market)
        uses: actions/cache@v4
        id: models-cache
        with:
          path: trading_system/models
          key: ai-models-${{ matrix.target }}-${{ steps.date.outputs.date }}
          restore-keys: |
            ai-models-${{ matrix.target }}-
            ai-models-

      - name: Run preseed for ${{ matrix.target }} (cache-only data run)
        id: run
        env:
          TRAIN_START_DATE: '2006-01-01'
          PRESEED_MODE: 'True'
          FORCE_UNIVERSE_REFRESH: 'true'
          INFERENCE_TARGET: ${{ matrix.target }}
          STOCK_PRICE_FRESHNESS_DAYS: '1'
          SKIP_TRAINING: 'True'
          SKIP_INFERENCE: 'True'
          FORCE_CPU: '1'
          LOG_LEVEL: INFO
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOREABANK_ECOS_KEY: ${{ secrets.KOREABANK_ECOS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          source .venv/bin/activate
          python trading_system/run_pipeline.py --skip-training --skip-inference --target ${{ matrix.target }} 2>&1

      - name: Write Step Summary
        if: always()
        run: |
          STATUS="${{ steps.run.outcome }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          echo "## ${ICON} Preseed Cache: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ 실행 정보" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 대상 시장 | ${{ matrix.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 상태 | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 일시 | $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST') |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 DB 캐시 파일 현황" >> $GITHUB_STEP_SUMMARY
          for db in stock_prices.db market_indicators.db; do
            DB_PATH="trading_system/$db"
            if [ -f "$DB_PATH" ]; then
              SIZE=$(du -sh "$DB_PATH" 2>/dev/null | cut -f1)
              echo "- **$db**: $SIZE" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **$db**: ⚠️ 생성되지 않음" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload databases as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-databases-${{ matrix.target }}
          path: |
            trading_system/stock_prices.db
            trading_system/market_indicators.db
          retention-days: 7

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MSG="🚨 *[CRITICAL] GHA Preseed Cache Failed*%0A%0A"
            MSG+="*Market:* ${{ matrix.target }}%0A"
            MSG+="*Status:* ${{ steps.run.outcome }}%0A"
            MSG+="*Time:* $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')%0A%0A"
            MSG+="*Run URL:* ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi
