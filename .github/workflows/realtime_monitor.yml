name: Realtime Monitor

permissions:
  contents: read

on:
  schedule:
    # KRX 장중: KST 09:00~15:45 = UTC 00:00~06:45, 평일 매 15분
    - cron: '*/15 0-6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: realtime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.lock') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip sync trading_system/requirements.lock

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 상태 DB를 캐시로 이어받아 15분 간격 실행 사이에도 손절/익절 발동 이력 유지 (중복 알림 방지)
      - name: Restore realtime state cache
        uses: actions/cache/restore@v4
        id: state-cache
        with:
          path: trading_system/realtime_state.db
          key: realtime-state-${{ steps.date.outputs.date }}
          restore-keys: |
            realtime-state-

      - name: Download latest ensemble predictions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p trading_system/result
          if gh release download --pattern "ensemble_predictions.txt" --dir trading_system/result --clobber 2>/dev/null; then
            echo "ensemble_predictions.txt downloaded from latest release"
          else
            echo "No release asset found - watchlist will be empty (monitor will exit cleanly)"
          fi

      - name: Run realtime monitor (once, dry-run)
        id: run
        env:
          LOG_LEVEL: INFO
          TZ: 'Asia/Seoul'
          REALTIME_STATE_DB: trading_system/realtime_state.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p trading_system/logs
          set -o pipefail
          .venv/bin/python trading_system/realtime_monitor.py --once --dry-run 2>&1 | tee trading_system/logs/realtime_monitor.log

      - name: Write Monitor Step Summary
        if: always()
        run: |
          STATUS="${{ steps.run.outcome }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          echo "## ${ICON} 실시간 모니터링 요약" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 내용 |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 일시 | $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST') |" >> $GITHUB_STEP_SUMMARY
          echo "| 모니터링 상태 | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          LOG_FILE="trading_system/logs/realtime_monitor.log"
          SYMBOLS_CNT=$(grep -o 'Monitored symbols: [0-9]*' "$LOG_FILE" 2>/dev/null | cut -d: -f2 | tr -d ' ' || echo "전체 감시")
          [ -z "$SYMBOLS_CNT" ] && SYMBOLS_CNT="워치리스트 종목 (정상)"
          echo "| 점검 종목 수 | ${SYMBOLS_CNT} |" >> $GITHUB_STEP_SUMMARY
          ALERT_CNT=$(grep -c 'ALERT' "$LOG_FILE" 2>/dev/null || echo "0")
          echo "| 활성 알림 수 | ${ALERT_CNT}건 |" >> $GITHUB_STEP_SUMMARY
          echo "| 시장 레짐 | 장중 실시간 감시 |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" != "success" ] && [ -f "$LOG_FILE" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **모니터링 오류 로그 (최근 20줄)**:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 20 "$LOG_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Telegram on Monitor Alert
        if: failure()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            ERR_SNIPPET=""
            LOG_FILE="trading_system/logs/realtime_monitor.log"
            if [ -f "$LOG_FILE" ]; then
              ERR_SNIPPET=$(tail -n 5 "$LOG_FILE" | tr '\n' ' ' | cut -c1-200)
            fi
            MSG="⚠️ *[Realtime Monitor] Run Failed*%0A%0A"
            MSG+="*Status:* ${{ steps.run.outcome }}%0A"
            MSG+="*Time:* $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')%0A"
            if [ -n "$ERR_SNIPPET" ]; then
              MSG+="*Error:* \`${ERR_SNIPPET}\`%0A"
            fi
            MSG+="*Run URL:* ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi

      - name: Save realtime state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trading_system/realtime_state.db
          key: realtime-state-${{ steps.date.outputs.date }}
