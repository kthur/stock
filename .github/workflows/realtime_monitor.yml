name: Realtime Monitor

permissions:
  contents: read

on:
  schedule:
    # KRX 장중: KST 09:00~15:45 = UTC 00:00~06:45, 평일 매 15분
    - cron: '*/15 0-6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: realtime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('trading_system/requirements.lock') }}

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip sync trading_system/requirements.lock

      - name: Get current date
        id: date
        run: echo "date=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 상태 DB를 캐시로 이어받아 15분 간격 실행 사이에도 손절/익절 발동 이력 유지 (중복 알림 방지)
      - name: Restore realtime state cache
        uses: actions/cache/restore@v4
        id: state-cache
        with:
          path: trading_system/realtime_state.db
          key: realtime-state-${{ steps.date.outputs.date }}
          restore-keys: |
            realtime-state-

      - name: Download latest ensemble predictions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p trading_system/result
          if gh release download --pattern "ensemble_predictions.txt" --dir trading_system/result --clobber 2>/dev/null; then
            echo "ensemble_predictions.txt downloaded from latest release"
          else
            echo "No release asset found - watchlist will be empty (monitor will exit cleanly)"
          fi

      - name: Run realtime monitor (once, dry-run)
        id: run
        env:
          LOG_LEVEL: INFO
          TZ: 'Asia/Seoul'
          REALTIME_STATE_DB: realtime_state.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: trading_system
        run: |
          .venv/bin/python realtime_monitor.py --once --dry-run 2>&1

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MSG="⚠️ *[Realtime Monitor] Run Failed*%0A%0A"
            MSG+="*Status:* ${{ steps.run.outcome }}%0A"
            MSG+="*Time:* $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')%0A%0A"
            MSG+="*Run URL:* ${RUN_URL}"
            curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi

      - name: Save realtime state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trading_system/realtime_state.db
          key: realtime-state-${{ steps.date.outputs.date }}
